<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Pikachu Game</title>

    <!-- Bootstrap 4.1.3 (chỉ cần phần CSS) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">

    <!-- File CSS riêng của game -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Thư viện jQuery (giống slide) -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <!-- File JavaScript riêng của game -->
    <script src="js/script.js"></script>
</head>
<body>

    <!-- container-fluid: rộng hết màn hình, vì bảng khá rộng -->
    <div class="container-fluid">

        <h1 id="tieu-de">PIKACHU GAME</h1>

        <p id="diem-so">Điểm: <span id="diem">0</span></p>

        <div id="khu-nut">
            <button type="button" id="nut-choi-lai" class="btn btn-primary">Chơi lại</button>
        </div>

        <!-- Thông báo khi thắng (lúc đầu sẽ bị ẩn bằng jQuery) -->
        <div id="thong-bao" class="alert alert-success">
            Chúc mừng! Bạn đã thắng!
        </div>

        <!-- Bảng game: 14 cột x 16 hàng (cộng 1 vòng viền trống) sẽ được JavaScript thêm vào đây -->
        <div id="bang-game">
        </div>

    </div>

</body>
</html>
